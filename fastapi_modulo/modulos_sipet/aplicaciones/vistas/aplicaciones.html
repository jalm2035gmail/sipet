<section id="applications-root" class="mx-auto max-w-5xl px-4 py-10">
  <link rel="stylesheet" href="{{ applications_css_url }}">

  <div class="mb-8">
    <h1 class="text-3xl font-black text-base-content">Panel de aplicaciones</h1>
    <p class="mt-2 text-base-content/60">
      Los módulos instalados registrarán aquí sus permisos y accesos disponibles.
    </p>
  </div>

  <div id="apps-modules-zone">
    <!-- Los módulos instalados inyectan su contenido aquí -->
  </div>

  <div id="apps-empty-state" class="rounded-2xl border border-dashed border-base-300 bg-base-200/50 px-8 py-16 text-center">
    <i class="fa-solid fa-cubes-stacked text-4xl text-base-content/30"></i>
    <p class="mt-4 text-base font-semibold text-base-content/50">Sin módulos instalados</p>
    <p class="mt-1 text-sm text-base-content/40">
      Cuando se instale un módulo aparecerá aquí con sus opciones de acceso.
    </p>
  </div>
</section>
