<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="{{ description }}" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png" />
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/">{{ app_name }}</a>
      <nav class="nav-actions">
        <button id="install-btn" class="btn btn-secondary is-hidden" type="button">Instalar app</button>
        <a class="btn btn-ghost" href="/login">Entrar</a>
        <a class="btn" href="/register">Crear cuenta</a>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <div id="connection-banner" class="banner banner-offline is-hidden">Sin conexión. Estás usando la versión offline.</div>
  </div>

  <main class="wrap page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>© {{ current_year }} {{ app_name }}</span>
      <span class="muted">PWA lista para instalación</span>
    </div>
  </footer>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
