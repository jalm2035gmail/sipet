{% extends "base.html" %}

{% block title %}Registro · {{ app_name }}{% endblock %}

{% block content %}
<section class="form-shell">
  <form id="register-form" class="card form-card">
    <h1>Crear cuenta</h1>
    <label>
      Nombre completo
      <input name="full_name" type="text" autocomplete="name" />
    </label>
    <label>
      Username
      <input name="username" type="text" required autocomplete="username" />
    </label>
    <label>
      Email
      <input name="email" type="email" required autocomplete="email" />
    </label>
    <label>
      Contraseña
      <input name="password" type="password" required minlength="8" autocomplete="new-password" />
    </label>
    <button class="btn" type="submit">Crear cuenta</button>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('register-form')?.addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = new FormData(event.currentTarget);
    try {
      const registerRes = await fetch('/api/v1/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          full_name: form.get('full_name') || null,
          username: form.get('username'),
          email: form.get('email'),
          password: form.get('password')
        })
      });
      const registerData = await registerRes.json();
      if (!registerRes.ok) {
        throw new Error(registerData.detail || 'No se pudo crear la cuenta');
      }

      const loginRes = await fetch('/api/v1/auth/login/json', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: form.get('email'),
          password: form.get('password')
        })
      });
      const loginData = await loginRes.json();
      if (loginRes.ok) {
        window.Auth.set(loginData.access_token, loginData.refresh_token);
      }
      window.toast('Cuenta creada correctamente', 'success');
      window.location.href = '/';
    } catch (error) {
      window.toast(error.message, 'error');
    }
  });
</script>
{% endblock %}
