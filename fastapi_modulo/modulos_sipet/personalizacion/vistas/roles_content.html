<section class="form-section">

  <div class="section-title">
    <h2>Gestión de roles</h2>
    <p class="section-description">Administra los roles del sistema. Los roles del sistema no pueden eliminarse.</p>
  </div>

  <form method="post" action="/roles/create" class="section-grid">
    <label class="form-field">
      <span>Nombre del rol</span>
      <input
        type="text"
        name="nombre"
        required
        class="campo-personalizado"
        placeholder="Ej. supervisor"
        maxlength="80"
        pattern="[a-zA-Z0-9_\- ]+"
        title="Solo letras, números, guiones y espacios"
      >
      <span class="field-hint">Se normalizará a snake_case al guardar. Ej: "Super Admin" → "super_admin"</span>
    </label>
    <label class="form-field">
      <span>Descripción</span>
      <input
        type="text"
        name="descripcion"
        class="campo-personalizado"
        placeholder="Describe el alcance de este rol"
        maxlength="255"
      >
    </label>
    <div class="form-field form-field--actions">
      <button type="submit" class="color-btn color-btn--primary">
        Crear rol
      </button>
    </div>
  </form>

  <div class="roles-table-wrapper">
    <table class="roles-table">
      <thead>
        <tr>
          <th scope="col">Nombre</th>
          <th scope="col">Descripción</th>
          <th scope="col" class="col-actions">Acciones</th>
        </tr>
      </thead>
      <tbody>
        {{ rows_html }}
      </tbody>
    </table>
  </div>

</section>
