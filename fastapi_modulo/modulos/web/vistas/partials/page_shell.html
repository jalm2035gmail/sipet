<main class="main-content min-h-screen">
    <div class="content-shell mx-auto">
        <section class="content-section card border border-base-300 shadow-xl">
            <div class="content-section-body card-body">
                {% if no_access_message %}
                {% include "modulos/web/vistas/partials/no_access_content.html" %}
                {% else %}
                {{ content | safe }}
                {% endif %}
            </div>
        </section>
    </div>
</main>
<script>
    (function() {
        var token = window.__sipet_csrf_token || '';
        if (!token) return;
        var forms = document.querySelectorAll('form[method="post"], form[method="POST"]');
        forms.forEach(function(form) {
            if (form.querySelector('input[name="csrf_token"]')) return;
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'csrf_token';
            input.value = token;
            form.appendChild(input);
        });
    })();
</script>
