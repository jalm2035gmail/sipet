<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Calendar body -->
  <rect x="10" y="20" width="80" height="68" rx="8" ry="8" fill="#1a6b3c"/>
  <!-- Calendar header -->
  <rect x="10" y="20" width="80" height="22" rx="8" ry="8" fill="#14532d"/>
  <rect x="10" y="34" width="80" height="8" fill="#14532d"/>
  <!-- Ring hooks -->
  <rect x="28" y="12" width="7" height="16" rx="3.5" ry="3.5" fill="#d1fae5"/>
  <rect x="65" y="12" width="7" height="16" rx="3.5" ry="3.5" fill="#d1fae5"/>
  <!-- Calendar grid dots -->
  <circle cx="26" cy="58" r="4" fill="#d1fae5" opacity="0.7"/>
  <circle cx="41" cy="58" r="4" fill="#d1fae5" opacity="0.7"/>
  <circle cx="56" cy="58" r="4" fill="#d1fae5" opacity="0.7"/>
  <circle cx="71" cy="58" r="4" fill="#d1fae5" opacity="0.7"/>
  <circle cx="26" cy="74" r="4" fill="#d1fae5" opacity="0.7"/>
  <circle cx="41" cy="74" r="4" fill="#d1fae5" opacity="0.7"/>
  <!-- Check mark on calendar -->
  <polyline points="52,68 60,78 76,55" fill="none" stroke="#86efac" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
