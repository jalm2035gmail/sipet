<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban – Citas</title>
<style>
/* kanban_citas.scss compiled inline */
:root { --col-width: 220px; }
#kanban-wrapper {
  display: flex;
  gap: 1rem;
  overflow-x: auto;
  padding: 1rem 0 2rem;
  min-height: 70vh;
}
.kanban-col {
  flex: 0 0 var(--col-width);
  background: #f0f4f8;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
}
.kanban-col-header {
  padding: .6rem 1rem;
  border-radius: 10px 10px 0 0;
  font-weight: 600;
  font-size: .85rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: #fff;
}
.kanban-col-body {
  flex: 1;
  overflow-y: auto;
  padding: .5rem;
  display: flex;
  flex-direction: column;
  gap: .5rem;
}
.kanban-card {
  background: #fff;
  border-radius: 7px;
  padding: .7rem .8rem;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  cursor: default;
  font-size: .82rem;
}
.kanban-card .kc-name { font-weight: 600; margin-bottom: .2rem; }
.kanban-card .kc-time { color: #666; font-size: .78rem; }
.kanban-card .kc-persona { color: #444; }
/* header colors per state */
[data-state=draft]       .kanban-col-header { background: #6c757d; }
[data-state=confirmed]   .kanban-col-header { background: #0d6efd; }
[data-state=in_progress] .kanban-col-header { background: #fd7e14; }
[data-state=completed]   .kanban-col-header { background: #198754; }
[data-state=cancelled]   .kanban-col-header { background: #dc3545; }
[data-state=no_show]     .kanban-col-header { background: #343a40; }
/* count badge */
.kanban-count {
  display: inline-block;
  background: rgba(255,255,255,.25);
  border-radius: 12px;
  padding: 0 7px;
  font-size: .75rem;
  margin-left: 6px;
}
/* filter bar */
#kanban-filters { gap: .5rem; }
.btn-sm { font-size: .8rem; }
</style>
</head>
<body>
<div class="container-fluid px-3 py-3">

  <!-- Filtros -->
  <div class="d-flex align-items-center flex-wrap mb-3" id="kanban-filters">
    <select id="filtro-ejecutivo" class="form-select form-select-sm" style="max-width:200px">
      <option value="">— Todos los ejecutivos —</option>
    </select>
    <button class="btn btn-outline-secondary btn-sm ms-2" onclick="loadKanban()">
      <i class="fa fa-refresh"></i> Actualizar
    </button>
    <span id="kanban-loading" class="ms-2 text-muted small d-none">Cargando…</span>
  </div>

  <!-- Tablero -->
  <div id="kanban-wrapper">
    <div class="text-muted p-3">Cargando tablero…</div>
  </div>

</div>

<script>
const ESTADOS = [
  { key: 'draft',       label: 'Borrador'     },
  { key: 'confirmed',   label: 'Confirmada'   },
  { key: 'in_progress', label: 'En curso'     },
  { key: 'completed',   label: 'Completada'   },
  { key: 'cancelled',   label: 'Cancelada'    },
  { key: 'no_show',     label: 'No asistió'   },
];

async function fetchJSON(url) {
  const r = await fetch(url, { credentials: 'include' });
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

function formatDT(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX', { day:'2-digit', month:'short' }) + ' ' +
         d.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
}

async function loadEjecutivos() {
  try {
    const res = await fetchJSON('/api/reservaciones/ejecutivos');
    const sel = document.getElementById('filtro-ejecutivo');
    (res.data || []).forEach(e => {
      const opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = e.name;
      sel.appendChild(opt);
    });
  } catch (_) {}
}

async function loadKanban() {
  const ej = document.getElementById('filtro-ejecutivo').value;
  const loader = document.getElementById('kanban-loading');
  loader.classList.remove('d-none');

  const groups = {};
  ESTADOS.forEach(e => groups[e.key] = []);

  try {
    let url = '/api/reservaciones/citas?limit=500';
    if (ej) url += `&ejecutivo_id=${ej}`;
    const res = await fetchJSON(url);
    (res.data || []).forEach(c => {
      if (groups[c.state] !== undefined) groups[c.state].push(c);
    });
  } catch (err) {
    document.getElementById('kanban-wrapper').innerHTML =
      `<div class="text-danger p-3">Error al cargar: ${err.message}</div>`;
    loader.classList.add('d-none');
    return;
  }

  const wrapper = document.getElementById('kanban-wrapper');
  wrapper.innerHTML = '';
  ESTADOS.forEach(({ key, label }) => {
    const cards = groups[key];
    const col = document.createElement('div');
    col.className = 'kanban-col';
    col.dataset.state = key;
    col.innerHTML = `
      <div class="kanban-col-header">
        ${label}<span class="kanban-count">${cards.length}</span>
      </div>
      <div class="kanban-col-body">
        ${cards.length === 0 ? '<div class="text-muted text-center small py-3">Sin citas</div>' :
          cards.map(c => `
            <div class="kanban-card">
              <div class="kc-name">${ResUtils ? ResUtils.escHtml(c.name) : c.name}</div>
              <div class="kc-persona">${c.nombre_persona || ''}</div>
              <div class="kc-time">${formatDT(c.start_datetime)}</div>
            </div>`).join('')}
      </div>`;
    wrapper.appendChild(col);
  });
  loader.classList.add('d-none');
}

document.getElementById('filtro-ejecutivo').addEventListener('change', loadKanban);

loadEjecutivos().then(loadKanban);
</script>
</body>
</html>
